<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEEKEEP B4 쿠션 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* PEEKEEP v2 B4 톤: 흰 폰 화면, 하늘색 Cushy 쿠션, 어두운 반응 스테이지. 글자는 최소, 쿠션의 높이가 곧 상태 */
  /* layout: 왼쪽 폰 목업, 오른쪽 테스트 패널 */
  --ink:#111214;
  --sub:#6E737A;
  --line:#E6E8EB;
  --panel:#F4F5F7;
  --sky:#97E6FB;
  --stage:#1D1D1F;
  --card:#3A3A3D;
  --page:#E8EBEE;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,.stage:focus-visible{outline:2px solid #2B8FB3;outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(0,420px) 360px;gap:40px;justify-content:center;align-items:start;padding:32px 16px 48px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr);justify-items:center}}

/* ---------- phone ---------- */
.phone-col{width:100%;max-width:420px;display:flex;justify-content:center}
.phone-scale{position:relative;width:calc(390px * var(--s,1));height:calc(844px * var(--s,1))}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--s,1));transform-origin:top left;background:#fff;border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px #D9DDE1,0 24px 60px rgba(30,40,50,.16)}
.abs{position:absolute}
.t-status{left:34px;top:15px;font-size:15px;font-weight:700}
.batt{left:334px;top:19px;width:25px;height:12px;border:1.5px solid #111;border-radius:4px}
.batt::after{content:"";position:absolute;left:1.5px;top:1.5px;width:17px;height:6px;background:#111;border-radius:1.5px}
.back{left:22px;top:58px;width:28px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center}
.title{left:0;right:0;top:59px;text-align:center;font-size:17px;font-weight:700}
.nav{left:24px;top:612px;width:342px;height:32px;display:flex;align-items:center;justify-content:center;gap:12px}
.nav-btn{width:32px;height:32px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:#3A3F45}
.nav-btn:hover{background:#F1F2F4}
.done-nav .nav-btn{visibility:hidden}
.counter{display:flex;gap:6px}
.counter i{width:7px;height:7px;border-radius:50%;background:#E1E4E8;transition:all .25s}
.counter i.done{background:#B9BEC4}
.counter i.cur{background:#111;transform:scale(1.25)}
.avatar{left:24px;top:100px;width:44px;height:44px;border-radius:50%;background:#7FD6F0;overflow:hidden;display:grid;place-items:center}
.who{left:80px;top:99px;font-size:16px;font-weight:700;transition:opacity .2s}
.who-sub{left:80px;top:124px;width:280px;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}

.panel{left:24px;top:160px;width:342px;height:372px;background:var(--panel);border:1px solid var(--line);border-radius:20px}

/* stage */
.stage{left:24px;top:176px;width:342px;height:340px;border-radius:20px;background:transparent;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0;will-change:transform}
.backdrop{position:absolute;left:0;right:0;top:0;height:0;background:var(--stage)}
.slide.anim{transition:transform .24s ease-in}
.layer{position:absolute;left:12px;right:12px;top:12px;transition:opacity .3s}
.layer-b{opacity:0;visibility:hidden}
.reveal-on .layer-a,.cover-on .layer-a,.done-on .layer-a,.done-on .layer-b{opacity:0;visibility:hidden}
.reveal-on .layer-b{opacity:1;visibility:visible}
.layer-a{display:flex;flex-direction:column;gap:10px}
.sum-card{background:var(--card);border-radius:14px;padding:12px 14px;color:#fff;position:relative}
.sum-row{display:flex;gap:10px;align-items:flex-start}
.sum-row .meter{margin-top:7px}
.sum-text{flex:1;font-size:14.5px;line-height:1.45;font-weight:500;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.useful{margin:6px 0 0;font-size:12.5px;color:#8EE6FA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-card{background:#2C2C2F;border:1px solid #47474B;border-radius:16px;padding:12px;color:#fff;display:flex;gap:10px;align-items:center}
.ask-card .mini{flex:0 0 34px;width:34px;height:28px}
.ask-body{flex:1;min-width:0}
.ask-text{margin:2px 2px 10px;font-size:15px;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 모바일 터치 영역 44px 이상 */
.ask-btns button{border:0;border-radius:12px;height:44px;font-size:15px;font-weight:700}
.ask-btns button:active{transform:scale(.97)}
.btn-yes{background:var(--sky);color:#0D2A33}
.btn-no{background:#47474B;color:#fff}
.orig{margin:0;padding:2px 2px 0;color:#fff;font-size:16px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* 강도 = 가시: 말이 까칠할수록 가시가 늘어요 (폭신한 쿠션과 대비) */
/* 강도 = 캡슐 게이지: 주의 가능성만큼 하늘색→노랑→코랄 그라데이션이 차오르고, 끝에 빛나는 점 */
.meter{position:relative;display:block;width:46px;height:8px;border-radius:99px;background:rgba(255,255,255,.14);flex:0 0 auto}
.meter i{display:none}
.meter::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#7FE3F7 0%,#FFD27A 55%,#FF7A6B 100%);clip-path:inset(0 calc(100% - var(--p,50%)) 0 0 round 99px);transition:clip-path .6s cubic-bezier(.2,.8,.2,1)}
.meter::after{content:"";position:absolute;top:50%;left:var(--p,50%);width:10px;height:10px;margin:-5px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 10px 2px var(--glow,#FF7A6B);transition:left .6s cubic-bezier(.2,.8,.2,1)}
.meter.on-light{background:rgba(15,47,56,.12)}
.meter.on-light::after{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 8px 1px var(--glow,#FF7A6B)}
/* cushion */
.cushion{position:absolute;left:-54px;top:0;width:450px;height:450px;will-change:transform;cursor:grab;transition:transform .45s cubic-bezier(.22,.9,.3,1.08)}
.cushion.dragging{transition:none;cursor:grabbing}
/* 다 덮었을 땐 B4 원래의 물결 쿠션, 내리기 시작하면 글자를 가리지 않는 네모 쿠션 */
.shape-wave,.shape-square{transition:opacity .25s}
.shape-wave{opacity:0}
.cushion.wave .shape-wave{opacity:1}
.cushion.wave .shape-square{opacity:0}
.cushion svg{display:block;width:100%;height:100%;filter:drop-shadow(0 -4px 10px rgba(0,0,0,.25))}
.topic-tag{position:absolute;left:50%;top:104px;transform:translateX(-50%) rotate(-3deg);background:#fff;color:#0F2F38;border-radius:14px;padding:9px 14px;white-space:nowrap;display:flex;align-items:center;gap:10px;box-shadow:0 4px 10px rgba(0,60,80,.18);transition:opacity .25s}
.topic-tag .hash{font-size:17px;font-weight:700;color:#2B8FB3}
.topic-tag #topicText{font-size:17px;font-weight:700;letter-spacing:-.01em}
/* 계속 깜빡이지 않고, 쿠션이 멈출 때만 한 번 깜빡여요 */
.eye-blink{transform-box:fill-box;transform-origin:center}
.cushion.blink .eye-blink{animation:blink .32s ease-in-out .35s 1}
@keyframes blink{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}
.sleep-eyes{opacity:0;transition:opacity .3s}
.done-on .eye-blink{opacity:0}
.done-on .sleep-eyes{opacity:1}

.knob{position:absolute;left:50%;width:44px;height:30px;margin-left:-22px;border:0;border-radius:15px;background:transparent;display:grid;place-items:center;z-index:3;color:rgba(15,47,56,.42);transition:top .45s cubic-bezier(.22,.9,.3,1.08),opacity .2s}
.knob:hover{color:rgba(15,47,56,.7)}
.knob svg{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 3px}}
.knob.up svg{animation:none}
.knob svg{transition:transform .3s}
.knob.up svg{transform:rotate(180deg)}
.knob[hidden]{display:none}
.stage.drag-hide .knob{opacity:0}

/* 눈금: 쿠션이 멈출 수 있는 높이 */
.ticks{position:absolute;right:0;top:0;bottom:0;width:14px;z-index:4;pointer-events:none}
.ticks i{position:absolute;right:4px;width:6px;height:2px;border-radius:1px;background:rgba(255,255,255,.45);transition:all .3s;margin-top:-1px}
.ticks i.cur{width:10px;background:#fff}

/* Cushy + 말풍선 (원문 단계, 끝 화면) */
.thought{position:absolute;left:50%;bottom:90px;width:max-content;max-width:250px;z-index:5;background:#fff;border-radius:18px;padding:11px 16px;font-size:14.5px;line-height:1.45;font-weight:700;color:#14171A;text-align:center;
  box-shadow:0 10px 24px rgba(0,0,0,.35);opacity:0;transform:translate(-50%,10px) scale(.92);transform-origin:50% 100%;transition:opacity .3s .12s,transform .4s cubic-bezier(.2,.9,.25,1.25) .12s;pointer-events:none}
.thought::before{content:"";position:absolute;left:50%;bottom:-6px;width:14px;height:14px;margin-left:-7px;background:#fff;border-radius:0 0 3px 0;transform:rotate(45deg)}
.reveal-on .thought,.done-on .thought{opacity:1;transform:translate(-50%,0)}
.done-on .thought{bottom:auto;top:66px;white-space:pre-line;line-height:1.5}
.restart{position:absolute;left:50%;top:244px;width:44px;height:44px;margin-left:-22px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2);display:none;place-items:center;z-index:5}
.done-on .restart{display:grid}

/* 처리 버튼 */
.actions{left:24px;top:546px;width:342px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.act{height:58px;border:1px solid var(--line);background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:#3A3F45}
.act[hidden]{display:none}
.actions[hidden]{display:none}
.tabbar{left:0;top:760px;width:390px;height:84px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-top:10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#8A8F95}
.tab.on{color:#111;font-weight:700}
.home-ind{left:128px;top:830px;width:134px;height:5px;border-radius:3px;background:#111}
.toast{left:50%;top:700px;transform:translate(-50%,8px);background:#111;color:#fff;border-radius:12px;padding:9px 14px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- control panel ---------- */
.ctrl{width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.ctrl h1{font-size:20px;line-height:1.3;margin:0}
.ctrl .lead{margin:4px 0 0;font-size:13.5px;color:#4A4F55}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h2{font-size:13.5px;margin:0;display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:700;color:#6E737A}
.seg button[aria-pressed="true"]{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:12.5px;color:#4A4F55;margin:0}
.ghost-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:700;color:#3A3F45}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;resize:vertical;background:#fff}
.row{display:flex;gap:8px}
input[hidden]{display:none}
.examples{display:flex;flex-wrap:wrap;gap:6px}
.ex{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 10px;font-size:12.5px;color:#3A3F45;text-align:left}
.ex:hover{border-color:#2B8FB3;background:#F0FAFD}
.primary{flex:1;border:0;background:#111;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700}
.primary:disabled{background:#B9BDC2;cursor:not-allowed}
.ai-state{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:10px;background:#F1F2F4;color:#6E737A;white-space:nowrap}
.ai-state.on{background:#E3F7FC;color:#0F6E8C}
.ai-state.busy{background:#FFF5DB;color:#8A6200}
.ai-state.err{background:#FDECEA;color:#B3261E}
.msg{font-size:12.5px;line-height:1.5;color:#4A4F55;margin:0;word-break:break-all}
.msg.err{color:#B3261E}
details{font-size:12.5px}
summary{cursor:pointer;font-weight:700;color:#4A4F55}
pre{white-space:pre-wrap;word-break:break-all;background:var(--panel);border-radius:10px;padding:10px;font-size:11.5px;line-height:1.5;max-height:240px;overflow:auto}
@media (prefers-reduced-motion:reduce){ .cushion,.companion,.thought,.toast,.knob,.slide.anim{transition:none} .eye-blink,.knob svg{animation:none} }
</style>
</head>
<body>
<div class="layout">
  <div class="phone-col">
    <div class="phone-scale">
      <div class="phone" id="phone">
        <div class="abs t-status">9:41</div>
        <div class="abs batt"></div>
        <button class="abs back" aria-label="뒤로"><svg width="10" height="18" viewBox="0 0 10 18"><path d="M9 1 1 9l8 8" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="abs title">가려진 반응</div>

        <div class="abs avatar" aria-hidden="true"></div>
        <div class="abs who" id="who">anon_92</div>
        <div class="abs who-sub" id="whoSub">개강날! 같이 준비해요 GRWM</div>

        <div class="abs stage" id="stage" tabindex="0" aria-label="가려진 반응. 위아래로 쿠션을 움직이고, 좌우로 다음 반응으로 넘겨요.">
          <div class="slide" id="slide">
            <div class="backdrop" id="backdrop"></div>
            <div class="layer layer-a" id="layerA">
              <div class="sum-card" id="sumCard">
                <div class="sum-row">
                  <p class="sum-text" id="sumText"></p>
                  <span class="meter" id="meterSum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
                </div>
                <p class="useful" id="useful" hidden></p>
              </div>
              <div class="ask-card" id="askCard">
                <div class="ask-body">
                  <p class="ask-text" id="askText"></p>
                  <div class="ask-btns">
                    <button class="btn-yes" id="btnYes">볼래</button>
                    <button class="btn-no" id="btnNo">그만</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="layer layer-b" id="layerB"><p class="orig" id="origText"></p></div>

            <div class="cushion" id="cushion">
              <svg viewBox="0 0 560 560" aria-hidden="true">
                <defs>
                  <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9ECFC"/><stop offset=".5" stop-color="#93E1F7"/><stop offset="1" stop-color="#7CD2EE"/></linearGradient>
                  <radialGradient id="hl" cx=".3" cy=".14" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
                </defs>
                <g class="shape-wave">
                  <path d="M0 70 C50 30 120 14 190 40 C240 58 270 64 300 42 C350 6 420 10 470 34 C510 52 535 50 560 34 L560 560 L0 560 Z" fill="url(#cg)"/>
                  <path d="M0 70 C50 30 120 14 190 40 C240 58 270 64 300 42 C350 6 420 10 470 34 C510 52 535 50 560 34 L560 560 L0 560 Z" fill="url(#hl)"/>
                </g>
                <g class="shape-square">
                  <path d="M65 40 Q65 4 101 4 H459 Q495 4 495 40 V560 H65 Z" fill="url(#cg)"/>
                  <path d="M65 40 Q65 4 101 4 H459 Q495 4 495 40 V560 H65 Z" fill="url(#hl)"/>
                </g>
                <g class="eye-blink">
                  <circle cx="205" cy="250" r="40" fill="#111"/><circle cx="205" cy="250" r="33" fill="#fff"/>
                  <circle cx="209" cy="255" r="22" fill="#111"/><circle cx="220" cy="243" r="7" fill="#8EE3F8"/>
                  <circle cx="355" cy="250" r="40" fill="#111"/><circle cx="355" cy="250" r="33" fill="#fff"/>
                  <circle cx="359" cy="255" r="22" fill="#111"/><circle cx="370" cy="243" r="7" fill="#8EE3F8"/>
                </g>
                <g class="sleep-eyes" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round">
                  <path d="M172 257 Q205 281 238 257"/><path d="M322 257 Q355 281 388 257"/>
                </g>
              </svg>
              <div class="topic-tag" id="topicTag"><span class="hash">#</span><span id="topicText"></span><span class="meter on-light" id="meterTag" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
            </div>

            <div class="thought" id="thought" role="status" aria-live="polite"><span id="thoughtText"></span></div>
            <button class="knob" id="knob" aria-label="쿠션 내리기"><svg width="16" height="10" viewBox="0 0 16 10"><path d="M2 2l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>

        <div class="abs nav" id="nav">
          <button class="nav-btn" id="prevBtn" aria-label="이전 반응"><svg width="9" height="16" viewBox="0 0 9 16"><path d="M8 1 1 8l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="counter" id="counter" aria-label="가려진 반응 순서"></div>
          <button class="nav-btn" id="nextBtn" aria-label="다음 반응"><svg width="9" height="16" viewBox="0 0 9 16"><path d="m1 1 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="abs actions" id="actions">
          <button class="act" id="hideBtn"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 17 17 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>숨김</button>
          <button class="act" id="pocketBtn"><svg width="20" height="20" viewBox="0 0 18 18"><path d="M2 2h14v7a7 7 0 0 1-14 0Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m6 7 3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span id="pocketLabel">요약만 포켓</span></button>
          <button class="act" id="reportBtn" hidden><svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 18V3m0 1h10l-2 4 2 4H4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>신고</button>
        </div>

        <div class="abs tabbar">
          <div class="tab on"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M2 9 10 2l8 7v9H2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>홈</div>

          <div class="tab"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 2h14v7a7 7 0 0 1-14 0Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m6 7 3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>포켓</div>

const STEPS = { COVER:["cover","summary","ask","reveal"], PEEK:["summary","ask","reveal"], REVEAL:["ask","reveal"] };
const MODE_HELP = { COVER:"다 가린 채로 시작해요", PEEK:"요약부터 보여줘요", REVEAL:"볼지 말지만 물어봐요" };
const STAGE_H = 340, REVEAL_Y = 268;
const DAILY = 5; // 하루에 볼 가려진 반응 수. 다 보면 오늘은 닫아서 계속 보게 되는 걸 막아요

/* ---------- state ---------- */
const S = { mode:"PEEK", queue:BASE.slice(), qi:0, done:new Set(), stepIdx:0, confirmed:false, finished:false, busy:false };
const stage = $("stage"), slide = $("slide"), cushion = $("cushion"), knob = $("knob");
const cur = () => S.queue[S.qi];
const steps = () => STEPS[S.mode];
const step = () => steps()[S.stepIdx];

/* ---------- geometry (layer A is always laid out, so measuring never jumps) ---------- */
function posFor(name){
  const sum = $("sumCard"), ask = $("askCard");
  if (name === "cover") return -14; // wavy top: the dips show a little dark like the original B4 screen
  if (name === "summary") return 12 + sum.offsetTop + sum.offsetHeight + 10;
  if (name === "ask") return Math.min(12 + ask.offsetTop + ask.offsetHeight + 10, REVEAL_Y - 24);
  return REVEAL_Y;
}
let curY = 0;
function setY(y){ curY = y; cushion.style.transform = "translateY(" + y + "px)"; $("backdrop").style.height = Math.max(0, y + 60) + "px"; }
function level(c){ return Math.max(1, Math.min(5, Math.ceil((Number(c) || 0) / 20))); }

/* ---------- render ---------- */
function renderData(){
  const it = cur(), d = it.ai;
  $("who").textContent = it.author;
  $("whoSub").textContent = CONTEXT.video;
  $("origText").textContent = it.text;
  $("sumText").textContent = d.summary;
  const u = $("useful");
  if (d.useful_point){ u.hidden = false; u.textContent = "→ " + d.useful_point; } else u.hidden = true;
  $("topicText").textContent = d.topic;
  const l = String(level(d.caution));

  const glow = d.caution >= 70 ? "#FF7A6B" : d.caution >= 40 ? "#FFD27A" : "#7FE3F7";
  [$("meterSum"), $("meterTag")].forEach(m => { m.style.setProperty("--p", Math.max(8, d.caution) + "%"); m.style.setProperty("--glow", glow); });
  $("meterSum").parentElement.setAttribute("title", "주의 가능성 " + d.caution + "%");
  $("askText").textContent = d.ask_again[S.mode];
  $("thoughtText").textContent = d.after_reveal[S.mode];
  $("json").textContent = JSON.stringify({ comment:it.text, author:it.author, first_time_commenter:it.first, mode:S.mode, cushy:d }, null, 2);
  renderCounter();
}

function renderCounter(){
  $("nav").classList.toggle("done-nav", S.finished);
  $("counter").innerHTML = S.queue.map((it,i) => '<i class="' + (S.finished ? "done" : i === S.qi ? "cur" : S.done.has(it.id) ? "done" : "") + '"></i>').join("");
}

function renderStep(){
  const st = step(), list = steps(), revealed = st === "reveal";
  stage.classList.toggle("reveal-on", revealed);
  stage.classList.toggle("cover-on", st === "cover");
  stage.classList.remove("drag-hide");
  $("topicTag").style.opacity = st === "cover" ? 1 : 0;
  // knob: below the eyes when fully covered, on the cushion top otherwise, hidden while Cushy asks
  knob.hidden = st === "ask";
  knob.classList.toggle("up", revealed);
  knob.setAttribute("aria-label", revealed ? "쿠션 올리기" : "쿠션 내리기");
  cushion.classList.remove("dragging");
  cushion.classList.toggle("wave", st === "cover");
  setY(posFor(st));
  cushion.classList.remove("blink"); void cushion.offsetWidth; cushion.classList.add("blink");
  knob.style.top = (st === "cover" ? curY + 256 : curY + 10) + "px";
  // actions
  $("pocketLabel").textContent = revealed ? "포켓" : "요약만 포켓";
  $("reportBtn").hidden = !revealed;
}

function goTo(idx){
  const list = steps();
  idx = Math.max(0, Math.min(list.length - 1, idx));
  if (list[idx] === "reveal" && !S.confirmed) idx = list.indexOf("ask");
  if (list[idx] !== "reveal") S.confirmed = false;
  S.stepIdx = idx;
  renderStep();
}

function resetItem(){ S.stepIdx = 0; S.confirmed = false; }

function showDone(){
  S.finished = true;
  stage.classList.remove("reveal-on");
  stage.classList.add("done-on");
  $("thoughtText").textContent = "오늘은 여기까지!\n나머지는 다음에 보자";
  $("topicTag").style.opacity = 0;
  knob.hidden = true;
  $("actions").hidden = true;
  $("who").style.opacity = 0; $("whoSub").style.opacity = 0;
  cushion.classList.remove("dragging");
  cushion.classList.add("wave");
  setY(-14);
  renderCounter();
}
function hideDone(){
  S.finished = false;
  stage.classList.remove("done-on");
  $("actions").hidden = false;
  $("who").style.opacity = 1; $("whoSub").style.opacity = 1;
}

/* slide to another comment: dir 1 = next, -1 = previous */
function slideTo(newIdx, dir){
  if (S.busy) return;
  S.busy = true;
  slide.classList.add("anim");
  slide.style.transform = "translateX(" + (-dir * 330) + "px)";
  setTimeout(() => {
    slide.classList.remove("anim");
    if (newIdx === -1){ showDone(); }
    else { hideDone(); S.qi = newIdx; resetItem(); renderData(); renderStep(); }
    slide.style.transform = "translateX(" + (dir * 330) + "px)";
    void slide.offsetWidth;
    slide.classList.add("anim");
    slide.style.transform = "translateX(0)";
    setTimeout(() => { slide.classList.remove("anim"); S.busy = false; }, 260);
  }, 240);
}
function nextPending(from){
  for (let k = 1; k <= S.queue.length; k++){
    const i = (from + k) % S.queue.length;
    if (!S.done.has(S.queue[i].id)) return i;
  }
  return -1;
}
/* a decision closes this comment: cushion back up, then the next one slides in */
function finishCurrent(say){
  if (S.busy || S.finished) return;
  S.done.add(cur().id);
  if (say) toast(say);
  goTo(0);
  setTimeout(() => slideTo(S.done.size >= DAILY ? -1 : nextPending(S.qi), 1), 380);
}

/* ---------- gestures ---------- */
let g = null;
stage.addEventListener("pointerdown", e => {
  if (e.target.closest("button") || S.busy) return;
  g = { x0:e.clientX, y0:e.clientY, start:curY, axis:null, moved:false, id:e.pointerId };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!g) return;
  const s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s")) || 1;
  const dx = (e.clientX - g.x0) / s, dy = (e.clientY - g.y0) / s;
  if (!g.axis && Math.hypot(dx, dy) > 6) g.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  if (!g.axis) return;
  g.moved = true;
  if (g.axis === "x"){
    slide.style.transform = "translateX(" + dx * 0.9 + "px)";
  } else if (!S.finished){
    cushion.classList.add("dragging");
    stage.classList.add("drag-hide");
    const list = steps();
    const min = posFor(list[0]);
    const max = S.confirmed ? REVEAL_Y : posFor("ask");
    setY(Math.max(min - 10, Math.min(max + 14, g.start + dy)));
  }
});
function endGesture(e){
  if (!g) return;
  const s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s")) || 1;
  const dx = ((e && e.clientX != null ? e.clientX : g.x0) - g.x0) / s;
  const was = g; g = null;
  if (was.axis === "x"){
    const dir = dx < 0 ? 1 : -1;
    if (Math.abs(dx) > 60 && !S.finished){
      const n = S.queue.length;
      slideTo((S.qi + dir + n) % n, dir);
    } else {
      slide.classList.add("anim"); slide.style.transform = "translateX(0)";
      setTimeout(() => slide.classList.remove("anim"), 260);
    }
    return;
  }
  if (S.finished) return;
  if (!was.moved){ return; }
  // snap from where the cushion was released, never from a re-measured layout
  const list = steps();
  let best = S.stepIdx, bd = Infinity;
  list.forEach((n,i) => {
    if (n === "reveal" && !S.confirmed) return;
    const d = Math.abs(posFor(n) - curY);
    if (d < bd){ bd = d; best = i; }
  });
  goTo(best);
}
stage.addEventListener("pointerup", endGesture);
stage.addEventListener("pointercancel", endGesture);
stage.addEventListener("keydown", e => {
  if (S.finished) return;
  if (e.key === "ArrowDown"){ e.preventDefault(); goTo(S.stepIdx + 1); }
  if (e.key === "ArrowUp"){ e.preventDefault(); goTo(S.stepIdx - 1); }
  if (e.key === "ArrowRight"){ e.preventDefault(); slideTo((S.qi + 1) % S.queue.length, 1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); slideTo((S.qi - 1 + S.queue.length) % S.queue.length, -1); }
});

knob.addEventListener("click", () => { if (step() === "reveal") goTo(0); else goTo(S.stepIdx + 1); });

$("hideBtn").addEventListener("click", () => finishCurrent("숨겼어"));
$("pocketBtn").addEventListener("click", () => finishCurrent(step() === "reveal" ? "포켓에 넣었어" : "요약만 챙겼어"));
$("reportBtn").addEventListener("click", () => finishCurrent("신고했어"));
$("prevBtn").addEventListener("click", () => { if (!S.finished) slideTo((S.qi - 1 + S.queue.length) % S.queue.length, -1); });
$("nextBtn").addEventListener("click", () => { if (!S.finished) slideTo((S.qi + 1) % S.queue.length, 1); });
$("restart").addEventListener("click", () => { S.done.clear(); S.finished = false; slideTo(0, 1); });

let tt;
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1400); }

/* ---------- Claude ---------- */
let sample = null, connecting = null;
// no status chip: progress shows on the send button, problems show in the message line
function setAi(state, text){ $("sendBtn").textContent = state === "busy" ? text : "Cushy에게 보내기"; }

function connectAI(){
  if (sample) return Promise.resolve(sample);
  if (connecting) return connecting;
  connecting = (async () => {
    if (!(window.claude && typeof window.claude.use === "function")){
      if (CUSHY_API){
        $("code").hidden = false;
        try { $("code").value = sessionStorage.getItem("peekeep_code") || ""; } catch(e){}
        msg("암호를 넣으면 AI가 문구를 만들어요.");
      } else msg("지금은 샘플 댓글만 볼 수 있어요.");
      return null;
    }
    try { sample = await window.claude.use("sample"); } catch(e){ sample = null; }
    if (sample){ setAi("on", "Claude 연결됨"); msg(""); }
    else { setAi("err", "AI 꺼짐"); msg("이 화면에서는 AI가 꺼져 있어요. claude.ai 아티팩트 화면에서 열어 주세요. (use=null)", true); }
    return sample;
  })();
  connecting.finally(() => { connecting = null; });
  return connecting;
}

"- 원문의 공격적인 단어는 옮기지 말고 순화해.",
"- 아래 [맥락]의 숫자만 써. 숫자·사실을 지어내지 마.",
"- '증거', '도달', '닿았다', '성장', '관심의 표시' 같은 교훈조 표현 금지.",
"",
"[성향별]",
"- COVER: 공감만.",
"- PEEK: 공감 + reframe_allowed면 사실 한 줄 툭 (예: '근데 처음 보는 닉네임이네?').",
"- REVEAL: 담담하게, reframe_allowed면 맥락 숫자로 (예: '응원은 18개!').",
"- 외모·인신공격이면 reframe_allowed=false. 공감 + 숨기자는 말만.",
"- 쓸모 있는 지적이면 after_reveal은 '포켓에 넣어둬' 류 조언.",
"",
"[필드]",
"- category: 주의/참고/응원. caution: 주의일 가능성 0~100 정수. intensity: 1~5.",
"- topic: 무엇에 관한 댓글인지 2~6자 명사구. 공격적 단어 금지.",
"- summary: 원문 안 봐도 알게, 반말, 공백 포함 20자 이내 (예: '영상 완성도가 별로래.', '편집이 빨라 어지럽대.'). 쓸 만한 지적이 있을 때만 짧게 담고, 없다는 말('고칠 점은 없어', '이유는 없어')은 쓰지 마.",
"- useful_point: 다음 콘텐츠에 쓸 개선점 8자 이내. 없으면 null.",
"- ask_again: 원문 보기 직전 질문. 반말 15자 이내, '볼래?'로 끝 (예: '좀 세. 볼래?', '괜찮아. 볼래?', '안 보는 게 나아. 볼래?'). 성향별 3개.",
"- after_reveal: 원문 본 직후 한마디. 반말 18자 이내. 성향별 3개.",
"",
"[맥락]",
"영상: " + CONTEXT.video + " (" + CONTEXT.platform + ")",
"반응 수: 응원 " + CONTEXT.cheer + "개, 참고 " + CONTEXT.reference + "개, 주의 " + CONTEXT.caution + "개",
"작성자: " + author + (first ? " (이 채널에 처음 댓글 단 사람)" : " (전에도 댓글 단 사람)"),
"",
"[댓글 원문]",
text,
"",
"아래 모양의 JSON 하나만 답해.",
'{"category":"주의","caution":80,"attack_type":"콘텐츠 평가|외모·인신공격|관계·기대|쓸모 있는 지적|기타","topic":"","intensity":3,"summary":"","useful_point":null,"reframe_allowed":true,"ask_again":{"COVER":"","PEEK":"","REVEAL":""},"after_reveal":{"COVER":"","PEEK":"","REVEAL":""}}'
  ].join("\n");
}

function normalize(d){
  if (typeof d === "string") d = JSON.parse(d);
  if (Array.isArray(d)) d = d[0];
  const ok = d && typeof d === "object" && d.summary && d.topic && d.ask_again && d.after_reveal &&
    ["COVER","PEEK","REVEAL"].every(k => d.ask_again[k] && d.after_reveal[k]);
  if (!ok) throw { code:"bad_shape", message:"필드가 빠진 응답" };
  d.caution = Math.max(0, Math.min(100, Math.round(Number(d.caution) || 0)));
  d.intensity = Math.max(1, Math.min(5, Math.round(Number(d.intensity) || 3)));
  if (!d.useful_point) d.useful_point = null;
  return d;
}

async function askCushy(){
  const text = $("custom").value.trim();
  const author = $("author").value.trim() || "익명";
  if (!text){ msg("댓글을 입력해 주세요.", true); $("custom").focus(); return; }
  if (!sample) await connectAI();
  const viaWorker = !sample && !!CUSHY_API;
  if (!sample && !viaWorker) return;
  if (viaWorker && !$("code").value.trim()){ msg("AI 암호를 입력해 주세요.", true); $("code").focus(); return; }
  $("sendBtn").disabled = true;
  const t0 = Date.now();
  const tick = setInterval(() => setAi("busy", "읽는 중 " + Math.round((Date.now() - t0) / 1000) + "초"), 500);
  setAi("busy", "읽는 중");
  msg("");
  try {
    let d;
    if (viaWorker){
      const r = await fetch(CUSHY_API, { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ text, author, code: $("code").value.trim() }) });
      const body = await r.json().catch(() => ({}));
      if (r.status === 401) throw { code:"wrong_code", message:"암호 불일치" };
      if (!r.ok || !body.ai) throw { code:"worker_" + r.status, message: body.error || "" };
      try { sessionStorage.setItem("peekeep_code", $("code").value.trim()); } catch(e){}
      d = normalize(body.ai);
    }
    else try { d = normalize(await sample.json(buildPrompt(text, author, true), { cache:false })); }
    catch (e1){
      // one fallback on a malformed answer: ask for plain text and parse it ourselves
      if (!e1 || !["invalid_json","bad_shape","empty_completion"].includes(e1.code)) throw e1;
      const r = await sample(buildPrompt(text, author, true), { cache:false });
      const m = r.text.match(/\{[\s\S]*\}/);
      if (!m) throw { code:"invalid_json", message:"JSON 없음" };
      d = normalize(m[0]);
    }
    const item = { id:"c" + Date.now(), author, first:true, text, ai:d };
    S.queue.splice(S.qi + 1, 0, item);
    $("custom").value = "";
    setAi("on", "Claude 연결됨");
    if (S.finished){ S.qi = S.qi; slideTo(S.queue.indexOf(item), 1); }
    else slideTo(S.qi + 1, 1);
  } catch (e) {
    const code = (e && (e.code || e.name)) || "unknown";
    const detail = (e && e.message) ? " · " + String(e.message).slice(0, 120) : "";
    setAi("err", "실패");
    const why = {
      not_granted:"AI 사용이 허용되지 않았어요. 새로고침 후 동의 창에서 허용해 주세요.",
      rate_limited:"요청이 많아요. 1분 뒤에 다시 눌러 주세요.",
      sampling_disabled:"이 계정에서는 AI를 쓸 수 없어요.",
      session_expired:"claude.ai에 다시 로그인해 주세요.",
      refused:"이 댓글은 Claude가 처리하지 않았어요. 다른 문장으로 해 보세요.",
      invalid_json:"응답 형식이 깨졌어요. 한 번 더 눌러 주세요.",
      wrong_code:"암호가 틀렸어요."
    }[code] || "문구를 만들지 못했어요. 한 번 더 눌러 주세요.";
    msg(why + " (" + code + detail + ")", true);
    if (code === "not_granted" || code === "sampling_disabled") sample = null;
  } finally {
    clearInterval(tick);
    $("sendBtn").disabled = false;
  }
}
$("sendBtn").addEventListener("click", askCushy);
document.querySelectorAll(".ex").forEach(b => b.addEventListener("click", () => {
  $("custom").value = b.dataset.t; $("author").value = b.dataset.a; $("custom").focus();
}));

/* ---------- fit phone to screen ---------- */
function fit(){
  const col = document.querySelector(".phone-col").clientWidth;
  document.documentElement.style.setProperty("--s", Math.min(1, col / 390).toFixed(3));
}
window.addEventListener("resize", fit);
fit();

$("segHelp").textContent = MODE_HELP[S.mode];
renderData(); renderStep();
connectAI();
})();
</script>
